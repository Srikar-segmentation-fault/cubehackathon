[project]
name = "rtn-agent"
version = "0.1.0"
description = "RTN — a Returns Manager agent that inspects e-commerce return photos and computes identity, completeness, condition, and disposition via a single VLM call plus a deterministic policy engine."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "openai>=1.40,<2",
    "python-dotenv>=1.0,<2",
    "tenacity>=8.2,<9",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
fusion = [
    "open-clip-torch>=2.24,<3",
    "torch>=2.2",
    "pillow>=10.0",
]
eval = [
    "scikit-learn>=1.4,<2",
    "pandas>=2.2,<3",
]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
